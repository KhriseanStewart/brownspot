name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/upload (e.g. v0.0.2). Required for workflow_dispatch."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CLI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build binaries
        run: bun run build:all

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            TAG="v${TAG}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          ASSETS=(
            CLI/dist/dotstart-darwin-arm64
            CLI/dist/dotstart-darwin-x64
            CLI/dist/dotstart-linux-x64
            CLI/dist/dotstart-linux-arm64
            scripts/install.sh
          )
          for f in "${ASSETS[@]}"; do
            test -f "$f" || { echo "missing asset: $f"; exit 1; }
          done

          NOTES_FILE="$(mktemp)"
          {
            echo "BrownSpot CLI release ${TAG}"
            echo
            echo "Install:"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/KhriseanStewart/brownspot/main/scripts/install.sh | bash"
            echo '```'
            echo
            echo "Or pin a version:"
            echo
            echo '```bash'
            echo "BROWNSPOT_VERSION=${TAG#v} curl -fsSL https://raw.githubusercontent.com/KhriseanStewart/brownspot/main/scripts/install.sh | bash"
            echo '```'
            echo
            echo "Binaries: \`dotstart-darwin-arm64\`, \`dotstart-darwin-x64\`, \`dotstart-linux-x64\`, \`dotstart-linux-arm64\`."
          } > "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading/clobbering assets"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE"
          fi
          rm -f "$NOTES_FILE"
